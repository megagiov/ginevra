<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Maschera pubblicitaria LDV 10x15 — GM Vegasi</title>
<style>
  /*
    Variabili di dimensione: lo script applica_maschera.py le sovrascrive
    (add_style_tag) con le misure esatte della pagina da brandizzare e con
    il riquadro di spazio bianco che ha trovato leggendo quella pagina.
    I valori qui sotto sono solo il default per l'anteprima standalone e
    corrispondono alla LDV GLS 105x148mm da cui è nata questa maschera.
  */
  :root {
    --page-w: 105mm;
    --page-h: 148mm;
    --box-top: 125mm;
    --box-h: 22mm;
    --badge-h: 14.4mm;
    --gap-badge: 3mm;
  }

  @page {
    size: var(--page-w) var(--page-h);
    margin: 0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: var(--page-w);
    height: var(--page-h);
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #111;
    /* Trasparente e non bianco: questo file viene stampato come overlay
       sopra il PDF della LDV (applica_maschera.py). Uno sfondo opaco
       coprirebbe l'etichetta invece di lasciarla intravedere. */
    background: transparent;
  }

  .foglio {
    position: relative;
    width: var(--page-w);
    height: var(--page-h);
    overflow: hidden;
  }

  /* Il riquadro dove vanno i badge: posizione e altezza arrivano dallo
     script, che le ricava dallo spazio bianco effettivo della pagina. Tutto
     il resto del foglio resta trasparente, così la LDV si vede intatta. */
  .zona-brand {
    position: absolute;
    top: var(--box-top);
    left: 0;
    width: var(--page-w);
    height: var(--box-h);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: var(--gap-badge);
  }

  /* Guida visiva del riquadro, solo per controllare l'anteprima: di default
     è spenta, altrimenti finirebbe stampata sulla LDV vera. Per accenderla,
     aggiungi la classe "guida" al tag <body>. */
  body.guida .zona-brand {
    outline: 0.3mm dashed #ccc;
  }

  /*
    Loghi reali (cartella loghi/), già convertiti in bianco/nero puro per la
    stampa monocromatica: vedi loghi/README.md per come sono nati da quelli
    a colori forniti dall'utente. Stessa altezza per entrambi ("proporzioni
    uguali al primo").
  */
  .badge-tiktokshop,
  .badge-tiktokshop-wordmark {
    height: var(--badge-h);
    width: auto;
    display: block;
    border-radius: 1.2mm;
  }

  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="foglio">
    <div class="zona-brand">
      <img class="badge-tiktokshop" src="loghi/gm-vegasi-tiktokshop.png" alt="GM Vegasi su TikTok Shop">
      <img class="badge-tiktokshop-wordmark" src="loghi/gm-vegasi-tiktokshop-wordmark.png" alt="TikTok Shop">
    </div>
  </div>
</body>
</html>
