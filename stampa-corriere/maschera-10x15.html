<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Maschera pubblicitaria LDV 10x15 — GM Vegasi</title>
<style>
  /*
    Variabili di dimensione: lo script applica_maschera.py le sovrascrive
    (add_style_tag) con le misure esatte della pagina della LDV da
    brandizzare, quindi qui restano solo i valori di default per
    l'anteprima standalone — la LDV GLS 105x148mm da cui è nata questa
    maschera, con l'etichetta reale alta ~86mm (90mm di margine di
    sicurezza).
  */
  :root {
    --page-w: 105mm;
    --page-h: 148mm;
    --zona-ldv-h: 90mm;
  }

  @page {
    size: var(--page-w) var(--page-h);
    margin: 0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: var(--page-w);
    height: var(--page-h);
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #111;
    /* Trasparente e non bianco: questo file viene stampato come overlay
       sopra il PDF della LDV (applica_maschera.py). Uno sfondo opaco
       coprirebbe l'etichetta invece di lasciarla intravedere. */
    background: transparent;
  }

  .foglio {
    position: relative;
    width: var(--page-w);
    height: var(--page-h);
    overflow: hidden;
  }

  /* Zona alta: qui sopra cade la LDV del corriere quando lo script fonde
     questo overlay sul PDF scaricato. Va lasciata vuota. */
  .zona-ldv {
    height: var(--zona-ldv-h);
    width: 100%;
  }

  /* Guida di allineamento, solo per controllare visivamente l'anteprima:
     di default è spenta (altrimenti finirebbe stampata sopra la LDV vera).
     Per accenderla durante un test, aggiungi la classe "guida" al tag
     <body>. */
  body.guida .zona-ldv {
    border-bottom: 0.3mm dashed #ccc;
  }

  /* Zona bassa: i due badge TikTok Shop, appoggiati in fondo al foglio e
     centrati come coppia (partono dal centro ed espandono ai lati) —
     piccoli apposta per stare lontano dall'area che il laser del corriere
     legge sopra. */
  .zona-brand {
    height: calc(var(--page-h) - var(--zona-ldv-h));
    width: 100%;
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    justify-content: center;
    gap: 3mm;
    padding-bottom: 4mm;
  }

  /*
    Loghi reali (cartella loghi/), già convertiti in bianco/nero puro per la
    stampa monocromatica: vedi loghi/README.md per come sono nati da quelli
    a colori forniti dall'utente. Stessa altezza per entrambi ("proporzioni
    uguali al primo").
  */
  .badge-tiktokshop,
  .badge-tiktokshop-wordmark {
    height: 14.4mm;
    width: auto;
    display: block;
    border-radius: 1.2mm;
  }

  @media print {
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="foglio">
    <div class="zona-ldv"></div>

    <div class="zona-brand">
      <img class="badge-tiktokshop" src="loghi/gm-vegasi-tiktokshop.png" alt="GM Vegasi su TikTok Shop">
      <img class="badge-tiktokshop-wordmark" src="loghi/gm-vegasi-tiktokshop-wordmark.png" alt="TikTok Shop">
    </div>
  </div>
</body>
</html>
