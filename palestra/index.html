<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D11">
<meta name="description" content="Registro allenamenti: esercizi, pesi, ripetizioni. Funziona offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestra">
<title>Palestra</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg id="sprite" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-dumbbell" viewBox="0 0 24 24">
    <rect x="1.5" y="8" width="3.5" height="8" rx="1.2"/><rect x="5" y="10" width="2.5" height="4" rx="0.8"/>
    <line x1="7.5" y1="12" x2="16.5" y2="12"/>
    <rect x="16.5" y="10" width="2.5" height="4" rx="0.8"/><rect x="19" y="8" width="3.5" height="8" rx="1.2"/>
  </symbol>
  <symbol id="i-clipboard" viewBox="0 0 24 24">
    <rect x="4" y="4" width="16" height="17" rx="2.5"/><rect x="8.5" y="2" width="7" height="4" rx="1.4"/>
    <line x1="8" y1="11.5" x2="16" y2="11.5"/><line x1="8" y1="15.5" x2="13.5" y2="15.5"/>
  </symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="16" rx="2.5"/><line x1="8" y1="2.5" x2="8" y2="7"/>
    <line x1="16" y1="2.5" x2="16" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/>
  </symbol>
  <symbol id="i-chart" viewBox="0 0 24 24">
    <polyline points="3,3 3,21 21,21"/><polyline points="6,16 10.5,10.5 14,13.5 20,6"/>
  </symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24">
    <line x1="3" y1="7" x2="21" y2="7"/><circle cx="9" cy="7" r="2.4"/>
    <line x1="3" y1="17" x2="21" y2="17"/><circle cx="15" cy="17" r="2.4"/>
  </symbol>
  <symbol id="i-heart" viewBox="0 0 24 24">
    <path d="M12 20.5S3.5 15.4 3.5 9.8A4.8 4.8 0 0 1 12 6.9a4.8 4.8 0 0 1 8.5 2.9c0 5.6-8.5 10.7-8.5 10.7z"/>
  </symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><polyline points="2,12 7,12 9.5,5 14,19 16.5,12 22,12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24">
    <line x1="4" y1="7" x2="20" y2="7"/><path d="M6.5 7v11.5A2.5 2.5 0 0 0 9 21h6a2.5 2.5 0 0 0 2.5-2.5V7"/>
    <path d="M9.5 7V4.8A1.3 1.3 0 0 1 10.8 3.5h2.4A1.3 1.3 0 0 1 14.5 4.8V7"/>
    <line x1="10.5" y1="11" x2="10.5" y2="17"/><line x1="13.5" y1="11" x2="13.5" y2="17"/>
  </symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20.5h4.2L20 8.7a2.3 2.3 0 0 0 0-3.2l-1.5-1.5a2.3 2.3 0 0 0-3.2 0L3.5 15.8V20z"/><line x1="14" y1="6" x2="18.5" y2="10.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><line x1="15.6" y1="15.6" x2="21" y2="21"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="8"/><line x1="12" y1="13.5" x2="12" y2="9"/><line x1="9" y1="2.5" x2="15" y2="2.5"/><line x1="12" y1="2.5" x2="12" y2="5.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><polyline points="4,12.5 9.5,18 20,6.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><polyline points="6,14 12,8 18,14"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><polyline points="6,10 12,16 18,10"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16.5"/><circle cx="12" cy="7.8" r="0.9" class="solid"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><line x1="12" y1="3" x2="12" y2="15"/><polyline points="7,10.5 12,15.5 17,10.5"/><path d="M4 18v1.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V18"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><line x1="12" y1="15.5" x2="12" y2="3.5"/><polyline points="7,8.5 12,3.5 17,8.5"/><path d="M4 18v1.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V18"/></symbol>
  <symbol id="i-bluetooth" viewBox="0 0 24 24"><polyline points="7,7.5 17,16.5 12,21 12,3 17,7.5 7,16.5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path d="M8 9.5H6.5A1.5 1.5 0 0 0 5 11v8.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V11a1.5 1.5 0 0 0-1.5-1.5H16"/><line x1="12" y1="3" x2="12" y2="14"/><polyline points="8.5,6.5 12,3 15.5,6.5"/></symbol>
  <symbol id="i-go" viewBox="0 0 24 24"><polyline points="9,5 16,12 9,19"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5s5.5 5 5.5 10a5.5 5.5 0 0 1-11 0c0-1.8.8-3.4 1.8-4.6.3 1.4 1.2 2.4 2.2 2.4 1.2 0 1.5-1.6 1.5-3.2 0-1.8 0-3.4 0-4.6z"/></symbol>
</defs></svg>

<header id="topbar">
  <h1 id="view-title">Oggi</h1>
  <div id="topbar-actions"></div>
</header>

<main id="view" tabindex="-1"></main>

<div id="rest-bar" hidden role="timer" aria-live="off">
  <button class="rest-adj" data-adj="-15" type="button" aria-label="Togli 15 secondi">−15</button>
  <div class="rest-core">
    <div id="rest-time">00:00</div>
    <div id="rest-track"><div id="rest-fill"></div></div>
  </div>
  <button class="rest-adj" data-adj="15" type="button" aria-label="Aggiungi 15 secondi">+15</button>
  <button id="rest-skip" type="button">Stop</button>
</div>

<nav id="tabbar" aria-label="Sezioni">
  <button data-view="oggi" class="active" type="button"><svg class="ico"><use href="#i-dumbbell"/></svg>Oggi</button>
  <button data-view="schede" type="button"><svg class="ico"><use href="#i-clipboard"/></svg>Schede</button>
  <button data-view="storico" type="button"><svg class="ico"><use href="#i-calendar"/></svg>Storico</button>
  <button data-view="progressi" type="button"><svg class="ico"><use href="#i-chart"/></svg>Progressi</button>
  <button data-view="impostazioni" type="button"><svg class="ico"><use href="#i-sliders"/></svg>Altro</button>
</nav>

<div id="modal-root" hidden>
  <div id="modal-backdrop"></div>
  <div id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header><h2 id="modal-title"></h2>
      <button id="modal-close" type="button" aria-label="Chiudi"><svg class="ico"><use href="#i-close"/></svg></button>
    </header>
    <div id="modal-body"></div>
  </div>
</div>

<div id="rest-flash" hidden aria-hidden="true"></div>

<div id="toast" role="status" hidden></div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/chart.js"></script>
<script src="js/catalog.js"></script>
<script src="js/hr.js"></script>
<script src="js/app.js"></script>
</body>
</html>
