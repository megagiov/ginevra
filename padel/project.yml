name: Padel
options:
  bundleIdPrefix: it.esempio
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  PadelKit:
    path: PadelKit

targets:
  Padel:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - package: PadelKit
      - target: PadelWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Padel
        CFBundleDevelopmentRegion: it
        LSApplicationCategoryType: public.app-category.sports
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PADEL_BUNDLE_PREFIX)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PadelWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "Entitlements/**"
      - path: Shared
    dependencies:
      - package: PadelKit
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Padel
        CFBundleDevelopmentRegion: it
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(PADEL_BUNDLE_PREFIX)
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "Padel legge battito e calorie durante la partita per mostrarteli al polso e nel riepilogo."
        NSHealthUpdateUsageDescription: "Padel salva ogni partita come allenamento di tennis nell'app Salute."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PADEL_BUNDLE_PREFIX).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Watch/Entitlements/HealthKit-$(PADEL_HEALTHKIT).entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HEALTHKIT_$(PADEL_HEALTHKIT)

schemes:
  Padel:
    build:
      targets:
        Padel: all
        PadelWatch: all
    run:
      config: Debug
    archive:
      config: Release
  PadelWatch:
    build:
      targets:
        PadelWatch: all
    run:
      config: Debug
