# START UP® — gamma tipo per classe
#
# ATTENZIONE, QUESTO FILE E' DIVERSO DAGLI ALTRI.
#
# `categorie.yml` e `prodotti.yml` contengono solo fatti verificati presi dalle
# pagine pubblicate. Questo file no: e' una PROPOSTA DI SVILUPPO. Gli articoli
# qui dentro non sono in produzione e non sono mai stati venduti.
#
# Per questo il catalogo li stampa in una sezione separata, intestata "Gamma
# tipo", che dichiara la cosa in chiaro. Non spostare questi articoli in
# `prodotti.yml`: quello e' il file della produzione reale.
#
# Cosa resta comunque vincolato ai fatti:
#   - la forma e i materiali restano dentro quello che la classe dichiara su
#     startupmoda.com (jersey, denim/chino/felpa, pelle o tessuto tecnico,
#     cuoio pieno fiore e sintetici, quarzo e automatici, acetato e metallo);
#   - il punto di applicazione del marchio e' quello scritto in categorie.yml;
#   - `prezzo` resta VUOTO. Un prezzo su un articolo mai prodotto e' un numero
#     inventato, e in un catalogo che gira tra i buyer diventa una trattativa
#     sbagliata.
#
# Codice: SU-<classe>-<sigla categoria>-<progressivo>.

intro:
  titolo: Gamma tipo
  sottotitolo: La linea da cui parte il campionario
  testo: >-
    Le pagine che seguono sono una proposta di sviluppo, non produzione in
    corso. Servono al licenziatario come punto di partenza per il campionario:
    articolazione della linea, forme, e soprattutto dove va il marchio su ogni
    pezzo. Misure, taglie e varianti colore sono indicative e si fissano in
    fase di approvazione campioni, insieme al prototipo e al packaging.

